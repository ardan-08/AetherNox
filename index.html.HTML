<!DOCTYPE html>
<html>
<head>
  <title>Image Selector</title>
  <style>
    body {
      background: #646161;
      min-height: 100vh;
      margin: 0;
      font-family: Arial, sans-serif;
      padding: 20px;
    }
    .image-container img {
      height: 300px;
      width: 300px;
    }
    label {
      display: block;
      font-size: 1.2rem;
      font-weight: bold;
      margin-top: 10px;
      width: auto;
      padding: 12px 0;
    }
    input {
      width: 250px;
      padding: 10px;
      margin-top: 5px;
      border-radius: 5px;
      border: 1px solid #ccc;
      box-sizing: border-box;
    }
    select, options {
      width: 250px;
      padding: 10px;
      margin-top: 5px;
      border-radius: 5px;
      border: 1px solid #ccc;
      box-sizing: border-box;
    }
  </style>
</head>
<body>
    <img src="logo.png.png" height="110" width="110"><br><br>
  <label>Nama Anda</label>
  <input type="text" id="nameInput" placeholder="masukin namamu"><br><br>

  <label for="imageSelect">pilih gambarnya rek</label><br>
  <select id="imageSelect">pilih
    <option value="">--Pilih Gambar--</option>
    <option value="https://th.bing.com/th/id/OIP.H88aKb7tUCF3XycKwqHjFgHaEK?r=0&o=7rm=3&rs=1&pid=ImgDetMain&o=7&rm=3">Shrek</option>
    <option value="https://th.bing.com/th/id/OIP.oe7ZqPy0gBdS5pEobFprdgHaEK?r=0&o=7rm=3&rs=1&pid=ImgDetMain&o=7&rm=3">Po</option>
    <option value="https://i.pinimg.com/originals/8e/c3/6a/8ec36a4722c6a4228dc778f6fe4545d5.jpg">toothless</option>
    <option value="https://th.bing.com/th/id/OIP.4sJ8ZIGLAyQ2iES1D-bXPwHaHa?r=0&o=7rm=3&rs=1&pid=ImgDetMain&o=7&rm=3">Miles Morales</option>
    <option value="https://media.tenor.com/zRgomxzbo5YAAAAM/funny.gif">Eagle</option>
    <option value="https://i.pinimg.com/originals/e3/28/8f/e3288f72ccd9bc0ddac441a2f12f59db.jpg" height="300" width="300">Cat</option>
  </select>

  <div class="image-container">
    <img id="displayImage" src="https://gerbangbanten.co.id/wp-content/uploads/2025/10/image-13.png" alt="Selected image will appear here">
  </div>

  <script>
    const imageSelect = document.getElementById('imageSelect');
    const displayImage = document.getElementById('displayImage');

    imageSelect.addEventListener('change', function() {
      if (this.value) {
        displayImage.src = this.value;
        displayImage.style.display = 'block';
      } else {
        displayImage.src = '';
        displayImage.style.display = 'none';
      }
    });
  </script>
</body>
</html>
